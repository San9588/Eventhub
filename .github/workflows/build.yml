name: Build APK

on:
  workflow_dispatch:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build EVENTSH release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew exec permission
        run: chmod +x eventsh/gradlew

      # Optional signing: if EVENTSH_KEYSTORE_B64 secret is set, restore the
      # keystore and sign the release. Otherwise an unsigned release is built.
      - name: Restore signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.EVENTSH_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > eventsh/eventsh.jks

      - name: Build release APK
        working-directory: eventsh
        env:
          EVENTSH_KEYSTORE: ../eventsh.jks
          EVENTSH_STORE_PASSWORD: ${{ secrets.EVENTSH_STORE_PASSWORD }}
          EVENTSH_KEY_ALIAS: ${{ secrets.EVENTSH_KEY_ALIAS }}
          EVENTSH_KEY_PASSWORD: ${{ secrets.EVENTSH_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ -f eventsh.jks ]; then
            ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          else
            ./gradlew assembleRelease assembleDebug --stacktrace 2>&1 | tee build.log
          fi

      - name: Upload APKs and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventsh-apk
          path: |
            eventsh/app/build/outputs/apk/release/*.apk
            eventsh/app/build/outputs/apk/debug/*.apk
            eventsh/build.log
          if-no-files-found: warn
